<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>нет сети — rega rega</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #FAF7F0;
    color: #0A0908;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px;
    text-align: center;
  }
  .wrap { max-width: 420px; }
  .mark {
    width: 48px;
    height: 48px;
    margin: 0 auto 28px;
    border-radius: 50%;
    background: #FF5E1A;
    position: relative;
  }
  .mark::after {
    content: "";
    position: absolute;
    inset: 0;
    margin: auto;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #FAF7F0;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 12px;
    text-transform: lowercase;
  }
  p {
    font-size: 15px;
    line-height: 1.5;
    color: rgba(10, 9, 8, 0.65);
    margin: 0 0 6px;
  }
  .en {
    color: rgba(10, 9, 8, 0.4);
    font-size: 13px;
  }
  button {
    margin-top: 28px;
    border: 1px solid rgba(10, 9, 8, 0.15);
    background: transparent;
    color: #0A0908;
    font-size: 14px;
    padding: 10px 20px;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
  }
  button:active { background: rgba(10, 9, 8, 0.06); }
  @media (prefers-color-scheme: dark) {
    html, body { background: #0A0908; color: #FAF7F0; }
    p { color: rgba(250, 247, 240, 0.6); }
    .en { color: rgba(250, 247, 240, 0.38); }
    .mark::after { background: #0A0908; }
    button { border-color: rgba(250, 247, 240, 0.2); color: #FAF7F0; }
    button:active { background: rgba(250, 247, 240, 0.08); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark"></div>
    <h1>нет сети</h1>
    <p>гид скоро вернётся — как только появится интернет.</p>
    <p class="en">the guide will be back as soon as you're back online.</p>
    <button onclick="location.reload()">попробовать снова</button>
  </div>
</body>
</html>
